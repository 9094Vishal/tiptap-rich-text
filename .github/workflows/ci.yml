name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace tiptap-react-editor

      - name: Typecheck
        run: npm run typecheck --workspace tiptap-react-editor

      - name: Test
        run: npm run test --workspace tiptap-react-editor

      - name: Build package
        run: npm run build --workspace tiptap-react-editor

      - name: Build playground
        run: npm run build --workspace playground
